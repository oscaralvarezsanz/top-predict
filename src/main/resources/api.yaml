openapi: 3.0.3
info:
  title: TopPredict API
  description: Prediction Microservice API for TopLeague
  version: 1.0.0
servers:
  - url: http://localhost:8080/top-predict
    description: Local Server
paths:
  /groups:
    post:
      tags:
        - Group
      summary: Create a new prediction group
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request (validation errors)
        '401':
          description: Unauthorized

  /groups/join:
    post:
      tags:
        - Group
      summary: Join an existing group using its invite code
      operationId: joinGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJoinRequest'
      responses:
        '200':
          description: Group joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Unauthorized
        '404':
          description: Invite code not found

  /me/groups:
    get:
      tags:
        - Group
      summary: Get all groups the logged-in user belongs to
      operationId: getMyGroups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
        '401':
          description: Unauthorized

  /groups/{groupId}/leaderboard:
    get:
      tags:
        - Group
      summary: Get the leaderboard/standings for a group
      operationId: getGroupLeaderboard
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Not a member)
        '404':
          description: Group not found

  /predictions:
    post:
      tags:
        - Prediction
      summary: Submit or edit a prediction for a match
      operationId: submitPrediction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionSubmitRequest'
      responses:
        '200':
          description: Prediction submitted or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Bad request (Invalid scores)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Match prediction locked or not a member of group)

  /me/groups/{groupId}/predictions:
    get:
      tags:
        - Prediction
      summary: Get all predictions made by the logged-in user in a specific group
      operationId: getMyGroupPredictions
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PredictionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Not a member)

  /groups/{groupId}/games/{gameId}/predictions:
    get:
      tags:
        - Prediction
      summary: Get all members' predictions in a group for a specific game
      operationId: getGroupGamePredictions
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group predictions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMemberPrediction'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Match is in the future, predictions are concealed)

  /groups/{groupId}/matchdays/{matchday}/predictions:
    get:
      tags:
        - Prediction
      summary: Get all members' predictions in a group for an entire matchday
      operationId: getGroupMatchdayPredictions
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: matchday
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Matchday predictions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchdayPredictionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Not a member)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GroupCreateRequest:
      type: object
      required:
        - name
        - leagueId
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        leagueId:
          type: integer
          
    GroupJoinRequest:
      type: object
      required:
        - inviteCode
      properties:
        inviteCode:
          type: string
          pattern: '^[A-Za-z0-9]{8}$'

    GroupResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: integer
        leagueId:
          type: integer
        inviteCode:
          type: string
        createdAt:
          type: string
          format: date-time

    GroupMemberStanding:
      type: object
      properties:
        userId:
          type: integer
        alias:
          type: string
        totalPoints:
          type: integer
        rank:
          type: integer

    LeaderboardResponse:
      type: object
      properties:
        groupId:
          type: integer
        groupName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMemberStanding'

    PredictionSubmitRequest:
      type: object
      required:
        - groupId
        - gameId
        - predictedHomeScore
        - predictedAwayScore
      properties:
        groupId:
          type: integer
        gameId:
          type: integer
        predictedHomeScore:
          type: integer
          minimum: 0
        predictedAwayScore:
          type: integer
          minimum: 0

    PredictionResponse:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: integer
        userId:
          type: integer
        gameId:
          type: integer
        predictedHomeScore:
          type: integer
        predictedAwayScore:
          type: integer
        pointsEarned:
          type: integer
          nullable: true
        status:
          type: string
          enum: [PENDING, EVALUATED]

    GroupMemberPrediction:
      type: object
      properties:
        userId:
          type: integer
        alias:
          type: string
        predictedHomeScore:
          type: integer
        predictedAwayScore:
          type: integer
        pointsEarned:
          type: integer
          nullable: true

    MatchdayPredictionResponse:
      type: object
      properties:
        gameId:
          type: integer
        userId:
          type: integer
        alias:
          type: string
        predictedHomeScore:
          type: integer
        predictedAwayScore:
          type: integer
        pointsEarned:
          type: integer
          nullable: true
